[supervisord]
nodaemon=true
user=root
loglevel=info

[program:otp-bot]
command=/railway/run-with-env.sh /app/.venv/bin/python /app/telegram_otp_allinone.py bot
directory=/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:otp-listen]
command=/railway/run-with-env.sh /app/.venv/bin/python /app/telegram_otp_allinone.py listen
directory=/app
autostart=true
autorestart=true
startsecs=30
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:otp-live-pull]
command=/railway/run-with-env.sh /app/.venv/bin/python /app/telegram_otp_allinone.py sync live
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:otp-live-login]
command=/railway/run-with-env.sh /app/.venv/bin/python /app/telegram_otp_allinone.py sync live-login
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:otp-live-status]
command=/railway/run-with-env.sh /app/.venv/bin/python /app/telegram_otp_allinone.py sync live-status
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
